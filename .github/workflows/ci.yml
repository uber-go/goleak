name: CI

on:
  push:
    branches: [master]
    tags: ['v*']
  pull_request:
    branches: ['*']

permissions:
  contents: read

jobs:

  test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        go: ["1.26.x", "1.27.x"]

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Setup Go
      uses: actions/setup-go@v4
      with:
        go-version: ${{ matrix.go }}

    - name: Test
      run: make cover

    - name: Upload coverage to codecov.io
      uses: codecov/codecov-action@v4
      env:
        CODECOV_TOKEN: ${{ secrets.CODECOV_TOKEN }}

  tinygo:
    name: TinyGo
    runs-on: ubuntu-latest

    steps:
    - name: Checkout code
      uses: actions/checkout@v3
    - name: Setup Go
      # Pin a Go version supported by this TinyGo release; the main test
      # matrix uses newer Go that TinyGo does not support yet.
      uses: actions/setup-go@v4
      with:
        go-version: "1.25.x"

    - name: Setup TinyGo
      uses: acifani/setup-tinygo@v3
      with:
        tinygo-version: "0.40.1"

    # Verify goleak builds and runs under TinyGo without panicking. TinyGo
    # defines the "tinygo" build tag, so it picks up ./internal/tinygocheck,
    # which standard Go tooling ignores. `run` (not `build`) is required: the
    # original bug was a runtime panic, not a compile error.
    - name: Smoke test
      run: tinygo run ./internal/tinygocheck

  lint:
    name: Lint
    runs-on: ubuntu-latest

    steps:
    - uses: actions/checkout@v4
      name: Check out repository
    - uses: actions/setup-go@v4
      name: Set up Go
      with:
        go-version: 1.27.x
        cache: false  # managed by golangci-lint

    - uses: golangci/golangci-lint-action@v9
      name: Install golangci-lint
      with:
        version: v2.13.1
        # Hack: Use the official action to download, but not run.
        # make lint below will handle actually running the linter.
        args: --help

    - run: make lint
      name: Lint
